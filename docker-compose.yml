# =============================================================================
# Cura — environnement de DÉVELOPPEMENT
#
#   docker compose up -d                 → tout : bases, Redis, migrations, API, Nginx
#   docker compose up -d postgres postgres-test redis redis-test
#                                        → infrastructure seule (API lancée en local : pnpm dev)
#
# Trois bases séparées :
#   - postgres       → cura_dev  (persistante, volume)
#   - postgres-test  → cura_test (éphémère en RAM, conteneur distinct : les tests
#                                 ne peuvent PAS toucher la base de dev)
#   - cura_prod      → docker-compose.prod.yml
# Les ports ne sont exposés que sur 127.0.0.1 (jamais sur le réseau local).
# =============================================================================
name: cura

x-api-env: &api-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  LOG_PRETTY: "false"
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  MIGRATIONS_DIR: /app/migrations
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  COOKIE_SECURE: "false"
  CORS_ORIGINS: ${CORS_ORIGINS}
  TRUST_PROXY_HOPS: "1"
  SWAGGER_ENABLED: "true"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-cura_dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cura_test
      POSTGRES_PASSWORD: cura_test_password
      POSTGRES_DB: cura_test
    ports: ["127.0.0.1:5433:5432"]
    # Données en RAM + durabilité désactivée : rapide, et repart de zéro à chaque redémarrage.
    tmpfs: [/var/lib/postgresql/data]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cura_test -d cura_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "cura_test_redis", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a cura_test_redis --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Migrations : conteneur éphémère exécuté AVANT l'API (l'API ne démarre que s'il réussit).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: cura-api:dev
    command: ["node", "dist/migrate.js", "up"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: cura-api:dev
    restart: unless-stopped
    environment: *api-env
    expose: ["3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
