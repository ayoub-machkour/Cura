$kind: http-request
name: 'Refresh token'
method: POST
url: '{{base_url}}/auth/refresh'
order: 3000
headers:
  - key: x-csrf-token
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.csrfToken) {
        pm.collectionVariables.set('csrf_token', res.csrfToken);
      }
