$kind: http-request
name: 'Claim account with activation code'
description: 'Links a new app account to the existing patient record. Wrong birth date 5 times locks the code.'
method: POST
url: '{{base_url}}/auth/claim'
order: 1500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "{{invitation_code}}",
      "birthDate": "1985-03-20",
      "email": "claimed.patient@example.com",
      "password": "StrongPassword123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201) {
        const res = pm.response.json();
        pm.collectionVariables.set('csrf_token', res.csrfToken);
        pm.collectionVariables.set('patient_id', res.user.patientId);
        pm.collectionVariables.set('invitation_code', '');
      }
