$kind: http-request
name: 'List available slots'
method: GET
url: '{{base_url}}/doctors/:doctorId/slots?from={{range_from}}&to={{range_to}}&limit=20'
order: 1000
pathVariables:
  - key: doctorId
    value: '{{doctor_id}}'
    description: 'Doctor UUID'
queryParams:
  - key: from
    value: '{{range_from}}'
    description: 'ISO 8601 datetime — set to now by the pre-request script (UTC "Z" format: a "+" offset would be decoded as a space)'
  - key: to
    value: '{{range_to}}'
    description: 'ISO 8601 datetime — now + 60 days'
  - key: limit
    value: '20'
    description: 'Number of results per page (1–100, default 20)'
  - key: cursor
    value: ''
    description: 'Pagination cursor (page.nextCursor of the previous response)'
    disabled: true
  - key: appointmentTypeId
    value: '{{appointment_type_id}}'
    description: 'Only slots long enough for this appointment type'
    disabled: true
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const now = new Date();
      pm.variables.set('range_from', now.toISOString());
      pm.variables.set('range_to', new Date(now.getTime() + 60 * 86400000).toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 200 && res.data.length > 0) {
        pm.collectionVariables.set('slot_id', res.data[0].id);
        console.log('slot_id =', res.data[0].id, '(' + res.data[0].startsAt + ')');
      }
