$kind: http-request
name: 'List my family'
method: GET
url: '{{base_url}}/me/family'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 200 && res.data.length > 0) pm.collectionVariables.set('dependent_id', res.data[0].patient.id);
