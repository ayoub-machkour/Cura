# Routes communes dev / prod

# Permissions-Policy : l'API n'a besoin d'aucune fonctionnalité navigateur.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Routes d'authentification : limite stricte anti force brute.
location ~ ^/api/v[0-9]+/auth/(login|register)$ {
  limit_req  zone=auth burst=5 nodelay;
  include    /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cura_api;
}

location /api/ {
  limit_req  zone=api burst=40 nodelay;
  limit_conn conn 20;
  include    /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cura_api;
}

location /health/ {
  access_log off;
  include    /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cura_api;
}

location / {
  return 404 '{"code":"ROUTE_NOT_FOUND","message":"Route introuvable"}';
}
