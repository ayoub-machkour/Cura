# Cura — configuration Nginx commune (dev et prod)
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  server_tokens off;                 # ne pas divulguer la version
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 30s;

  # Protection contre les requêtes lentes / volumineuses (slowloris, upload abusif)
  client_max_body_size   1m;
  client_body_timeout    10s;
  client_header_timeout  10s;
  send_timeout           15s;

  # Logs JSON corrélés à l'API via $request_id (transmis en x-request-id)
  log_format json escape=json '{"time":"$time_iso8601","reqId":"$request_id","remote":"$remote_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstreamRt":"$upstream_response_time","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain;

  # Limitation de débit (1re ligne de défense ; l'API applique aussi la sienne via Redis)
  limit_req_zone  $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status  429;
  limit_conn_status 429;

  upstream cura_api {
    server api:3000;
    keepalive 32;
  }

  # Prêt pour les WebSockets (agenda / file d'attente live)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  include /etc/nginx/conf.d/*.conf;
}
